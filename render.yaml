services:
  - type: web
    name: jeene-backend
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      # Firebase Admin service-account JSON (the whole file's contents, pasted
      # in the Render dashboard). Used to verify Firebase ID tokens.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # DeepSeek key for writing question explanations. Set in the Render dashboard,
      # never committed. Only the pipeline calls the model; the API never does, so this
      # is here for the day generation moves onto a server rather than a laptop.
      - key: DEEPSEEK_API_KEY
        sync: false
      # --- Jeene Mode -------------------------------------------------------------
      # The study planner. All three are optional and their absence is not an error:
      # with no key, or with the flag off, every plan comes from the deterministic
      # planner and no network call is made. That is a supported configuration, and it
      # is the one to fall back to if the model ever misbehaves in production.
      - key: OPENAI_API_KEY
        sync: false
      - key: JEENE_PLANNER_MODEL
        sync: false
      - key: JEENE_PLANNER_ENABLED
        sync: false
      # Signs the short-lived links the app uses to open the notes viewer. Generate once
      # with `python3 -c "import secrets; print(secrets.token_hex(32))"`.
      #
      # Not optional in a deployment. Without it every worker signs with its own random
      # secret, so a link minted by one worker is refused by another and the notes fail
      # to open for roughly (workers - 1)/workers of requests — intermittently, which is
      # the worst way for it to fail.
      - key: JEENE_ASSET_SECRET
        sync: false
      # Hosts the notes viewer may stream a PDF from, comma-separated. Leave unset in
      # production: the default rule is https plus a globally-routable address, which is
      # stricter than a list somebody has to remember to update. Naming hosts is for a
      # local setup pointing at a plain-http fixture server.
      - key: JEENE_NOTES_STORAGE_HOSTS
        sync: false
      # Origins allowed to drive a test sitting from a browser. Explicit rather than
      # a wildcard: these endpoints accept a credential, and any site permitted here
      # could sit a paper on a student's behalf. Both Firebase Hosting domains for
      # the project are listed because either can serve the same deploy, and both the
      # apex and www of the custom domain because CORS matches an origin exactly.
      # --- Billing (Google Play and the App Store) ---------------------------------
      # Ships off. With the flag unset the store routes answer 503 and every gate passes,
      # which is the right behaviour for a half-configured deployment: refusing to confirm
      # a purchase is recoverable (the stores retry, and so does the app), granting one we
      # could not check is not.
      - key: JEENE_BILLING_ENABLED
        sync: false
      # --- Google Play. The service account's whole JSON key, as with Firebase's.
      # Server only: it can read orders and consume purchases. The push pair is the
      # service account and audience set on the Pub/Sub push subscription; together they
      # are the only authentication /billing/google/notifications has.
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT
        sync: false
      - key: GOOGLE_PUBSUB_PUSH_AUDIENCE
        sync: false
      # --- The App Store. The bundle id verifies test-environment purchases; production
      # ones also need the numeric Apple ID. The In-App Purchase key lets the reconciler
      # read notifications Apple could not deliver; paste the whole .p8 file.
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_APP_ID
        sync: false
      - key: APPLE_IAP_KEY_ID
        sync: false
      - key: APPLE_IAP_ISSUER_ID
        sync: false
      - key: APPLE_IAP_PRIVATE_KEY
        sync: false
      # What the reconciler cron presents. Not a user credential and never sent to a
      # client; the same value goes on the cron service below. Unset, the reconcile
      # endpoint answers 503 rather than running unauthenticated — it can grant access.
      - key: JEENE_RECONCILE_SECRET
        sync: false
      - key: JEENE_WEB_ORIGINS
        value: https://jeene-ff8e3.web.app,https://jeene-ff8e3.firebaseapp.com,https://jeeneeducare.com,https://www.jeeneeducare.com,https://jeene-admin.web.app,https://jeene-admin.firebaseapp.com

  # The last confirmation path. The other two depend on something arriving — the app
  # handing a purchase over, a store's notification — and each has a way of not
  # arriving. This one asks the stores directly: it consumes Google purchases before
  # Google's three-day automatic refund, settles pending ones, applies refunds nobody
  # announced, and reads back Apple's undelivered notifications.
  #
  # Every five minutes, because a student waiting to be let into what they just paid for
  # is the thing being minimised. The sweep is idempotent and usually finds nothing, so a
  # missed run costs one student a few minutes and a doubled run costs nothing at all.
  - type: cron
    name: jeene-billing-reconciler
    runtime: python
    region: singapore
    plan: starter
    schedule: "*/5 * * * *"
    # Nothing to build: the job is a curl. Kept as a cron service rather than a thread
    # inside the web service so a sweep still happens across a restart or a deploy, and
    # so a failing sweep is visible as a failed run rather than as a quiet log line.
    buildCommand: "true"
    startCommand: ./scripts/reconcile.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JEENE_API_BASE
        value: https://jeene-backend.onrender.com
      # The same value as JEENE_RECONCILE_SECRET on the web service above.
      - key: JEENE_RECONCILE_SECRET
        sync: false
