services:
  - type: web
    name: jeene-backend
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      # Firebase Admin service-account JSON (the whole file's contents, pasted
      # in the Render dashboard). Used to verify Firebase ID tokens.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # DeepSeek key for writing question explanations. Set in the Render dashboard,
      # never committed. Only the pipeline calls the model; the API never does, so this
      # is here for the day generation moves onto a server rather than a laptop.
      - key: DEEPSEEK_API_KEY
        sync: false
      # --- Jeene Mode -------------------------------------------------------------
      # The study planner. All three are optional and their absence is not an error:
      # with no key, or with the flag off, every plan comes from the deterministic
      # planner and no network call is made. That is a supported configuration, and it
      # is the one to fall back to if the model ever misbehaves in production.
      - key: OPENAI_API_KEY
        sync: false
      - key: JEENE_PLANNER_MODEL
        sync: false
      - key: JEENE_PLANNER_ENABLED
        sync: false
      # Signs the short-lived links the app uses to open the notes viewer. Generate once
      # with `python3 -c "import secrets; print(secrets.token_hex(32))"`.
      #
      # Not optional in a deployment. Without it every worker signs with its own random
      # secret, so a link minted by one worker is refused by another and the notes fail
      # to open for roughly (workers - 1)/workers of requests — intermittently, which is
      # the worst way for it to fail.
      - key: JEENE_ASSET_SECRET
        sync: false
      # Hosts the notes viewer may stream a PDF from, comma-separated. Leave unset in
      # production: the default rule is https plus a globally-routable address, which is
      # stricter than a list somebody has to remember to update. Naming hosts is for a
      # local setup pointing at a plain-http fixture server.
      - key: JEENE_NOTES_STORAGE_HOSTS
        sync: false
      # Origins allowed to drive a test sitting from a browser. Explicit rather than
      # a wildcard: these endpoints accept a credential, and any site permitted here
      # could sit a paper on a student's behalf. Both Firebase Hosting domains for
      # the project are listed because either can serve the same deploy, and both the
      # apex and www of the custom domain because CORS matches an origin exactly.
      - key: JEENE_WEB_ORIGINS
        value: https://jeene-ff8e3.web.app,https://jeene-ff8e3.firebaseapp.com,https://jeeneeducare.com,https://www.jeeneeducare.com,https://jeene-admin.web.app,https://jeene-admin.firebaseapp.com
