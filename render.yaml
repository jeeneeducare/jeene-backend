services:
  - type: web
    name: jeene-backend
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      # Firebase Admin service-account JSON (the whole file's contents, pasted
      # in the Render dashboard). Used to verify Firebase ID tokens.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # DeepSeek key for writing question explanations. Set in the Render dashboard,
      # never committed. Only the pipeline calls the model; the API never does, so this
      # is here for the day generation moves onto a server rather than a laptop.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Origins allowed to drive a test sitting from a browser. Explicit rather than
      # a wildcard: these endpoints accept a credential, and any site permitted here
      # could sit a paper on a student's behalf. Both Firebase Hosting domains for
      # the project are listed because either can serve the same deploy, and both the
      # apex and www of the custom domain because CORS matches an origin exactly.
      - key: JEENE_WEB_ORIGINS
        value: https://jeene-ff8e3.web.app,https://jeene-ff8e3.firebaseapp.com,https://jeeneeducare.com,https://www.jeeneeducare.com,https://jeene-admin.web.app,https://jeene-admin.firebaseapp.com
